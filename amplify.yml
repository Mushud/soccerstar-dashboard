version: 1
frontend:
  phases:
    preBuild:
      commands:
        # vite@8 / rolldown require Node ^20.19.0 || >=22.12.0. Amplify's default image Node
        # is not guaranteed to satisfy that, and on an older Node the build dies with
        # "SyntaxError: 'node:util' does not provide an export named 'styleText'" — which
        # looks like a dependency bug rather than a runtime version problem. Pin it.
        - nvm install 22
        - nvm use 22
        - node -v
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    # vite's default output directory
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .npm/**/*
